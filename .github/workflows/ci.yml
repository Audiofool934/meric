name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Source, tests, and release surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.5.1
          python -m pip install \
            huggingface-hub==0.27.0 \
            numpy==1.26.4 \
            pytest==8.3.5 \
            ruff==0.11.13 \
            tqdm==4.67.1

      - name: Lint
        run: ruff check meric scripts tests

      - name: Check formatting
        run: ruff format --check meric scripts tests

      - name: Run CPU tests
        run: python -m pytest -q

      - name: Compile public Python sources
        run: python -m compileall -q meric scripts

      - name: Verify release surface and relative links
        run: python scripts/release/verify_release.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: python -m pip install build==1.2.2.post1 twine==6.1.0

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          from pathlib import PurePosixPath

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"expected one source distribution, found {sdists}")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          with tarfile.open(sdists[0]) as archive:
              source_names = archive.getnames()

          binary_suffixes = {".ckpt", ".mp3", ".npy", ".npz", ".pth", ".pt", ".wav", ".zip"}

          def forbidden(entries):
              return [
                  name
                  for name in entries
                  if {"research", "configs", "train"} & set(PurePosixPath(name).parts)
                  or PurePosixPath(name).suffix.lower() in binary_suffixes
              ]

          wheel_forbidden = forbidden(names)
          source_forbidden = forbidden(source_names)
          if wheel_forbidden:
              raise SystemExit(f"forbidden wheel entries: {wheel_forbidden}")
          if source_forbidden:
              raise SystemExit(f"forbidden source-distribution entries: {source_forbidden}")
          if "meric/pipeline.py" not in names:
              raise SystemExit("wheel does not contain meric/pipeline.py")
          if not any(name.endswith(".dist-info/licenses/NOTICE") for name in names):
              raise SystemExit("wheel does not contain NOTICE")
          print(f"validated {len(names)} wheel entries")
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Reject internal research history
        run: |
          git log --all --format= --name-only -- research/ > "$RUNNER_TEMP/meric-internal-history-paths.txt"
          if test -s "$RUNNER_TEMP/meric-internal-history-paths.txt"; then
            echo "::error::Internal research files are reachable from repository history."
            exit 1
          fi

      - name: Scan complete source history
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: 3.96.0
          # An explicit head and empty base scan the full history, including on force pushes.
          head: ${{ github.sha }}
          # The action already supplies --fail and --no-update.
          extra_args: --results=verified,unknown
